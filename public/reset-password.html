<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Saraha password</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f5f9; color: #172033; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px; border-radius: 20px; background: white; box-shadow: 0 16px 48px #13213b18; }
      h1 { margin-top: 0; }
      label { display: block; margin: 18px 0 8px; font-weight: 600; }
      input, button { box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #d5dbea; border-radius: 10px; font: inherit; }
      button { margin-top: 22px; background: #4f46e5; color: white; border: 0; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 1.5em; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset password</h1>
      <p>Choose a new password for your Saraha account.</p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
        <button type="submit">Update password</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#reset-form");
      const status = document.querySelector("#status");
      const button = form.querySelector("button");
      const token = new URLSearchParams(location.search).get("token");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.querySelector("#password").value;
        const confirmation = document.querySelector("#confirm-password").value;
        if (!token) { status.textContent = "Reset link is missing its token."; return; }
        if (password !== confirmation) { status.textContent = "Passwords do not match."; return; }
        button.disabled = true;
        status.textContent = "Updating password…";
        try {
          const response = await fetch("/api/v1/auth/reset-password", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token, password }),
          });
          const result = await response.json();
          status.textContent = response.ok ? "Password updated. You can now sign in." : result.message || "Could not reset password.";
          if (response.ok) form.reset();
        } catch {
          status.textContent = "Could not connect. Please try again.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
